<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVORA OS">
<meta name="theme-color" content="#15253D">
<title>AVORA — Business Launch OS</title>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/ibm-plex/6.4.1/css/ibm-plex-mono.min.css');
  @import url('https://cdnjs.cloudflare.com/ajax/libs/ibm-plex/6.4.1/css/ibm-plex-sans.min.css');

  :root{
    --navy:#15253D; --navy-2:#1D3350; --steel:#A7ADB3; --off:#F7F5EF; --black:#202226;
    --sage:#708078; --sage-2:#8A9A8F; --line:#E7E3D6; --danger:#8C4A3D; --warn:#9C7C3E; --ok:#4B6B52;
    --card:#FFFFFF; --radius:3px; --sidebar-w:238px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--off);color:var(--black);font-family:'IBM Plex Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .tracked{letter-spacing:0.09em;}
  ::selection{background:var(--sage);color:#fff;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  #app{display:flex;min-height:100vh;}
  #sidebar{width:var(--sidebar-w);background:var(--navy);color:var(--off);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand-block{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.12);}
  .brand-word{font-size:19px;font-weight:700;letter-spacing:0.12em;}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--steel);margin-top:3px;}
  .founder-filter-block{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.12);}
  .founder-filter-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:var(--steel);margin-bottom:6px;}
  select.founder-select{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);color:#fff;padding:7px 8px;border-radius:var(--radius);font-size:12px;}
  select.founder-select option{color:#000;}
  #navlist{flex:1;overflow-y:auto;padding:8px 0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:12.5px;letter-spacing:0.03em;color:rgba(247,245,239,0.68);border-left:3px solid transparent;cursor:pointer;white-space:nowrap;}
  .nav-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(247,245,239,0.4);width:16px;flex-shrink:0;}
  .nav-item:hover{color:#fff;background:rgba(255,255,255,0.05);}
  .nav-item.active{color:#fff;border-left-color:var(--sage-2);background:rgba(255,255,255,0.1);font-weight:700;}
  .nav-item.active .nav-num{color:var(--sage-2);}
  .sidebar-foot{padding:12px 20px 16px;border-top:1px solid rgba(255,255,255,0.12);font-size:11px;color:var(--steel);}

  #main{flex:1;min-width:0;padding:26px 34px 90px;max-width:1320px;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .page-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:var(--sage);text-transform:uppercase;}
  .page-title{font-size:32px;font-weight:700;letter-spacing:-0.01em;margin-top:2px;line-height:1.15;}
  .page-subtitle{font-size:14px;color:var(--steel);margin-top:6px;max-width:520px;line-height:1.5;}
  .page-actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
  @media(max-width:767px){
    .page-title{font-size:25px;}
    .page-subtitle{font-size:13px;}
    .page-actions{width:100%;}
    .page-actions .btn:not(.sm):not(.xs):not(.ghost){width:100%;}
  }

  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:0.02em;border-radius:var(--radius);}
  .btn:hover{background:var(--navy-2);}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);font-weight:500;}
  .btn.ghost:hover{border-color:var(--navy);}
  .btn.sm{padding:7px 12px;font-size:12px;}
  .btn.xs{padding:4px 8px;font-size:11px;}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.icon{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
  .btn[disabled]{opacity:0.35;cursor:default;}
  .btn.primary-mobile{width:100%;padding:14px;font-size:14px;}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .card.tight{padding:15px;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.09em;color:var(--steel);text-transform:uppercase;}
  .widget-title{font-size:15px;font-weight:700;color:var(--black);}
  .stat-value{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-0.01em;}
  .stat-sub{font-size:11.5px;color:var(--steel);margin-top:4px;}

  .section-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-left:10px;border-left:3px solid var(--sage);}
  .section-title .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);font-weight:400;}

  .bar-track{background:var(--line);height:6px;border-radius:3px;overflow:hidden;margin-top:8px;}
  .bar-fill{height:100%;background:var(--sage);}
  .bar-fill.warn{background:var(--warn);} .bar-fill.danger{background:var(--danger);}

  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;padding:2px 7px;border-radius:2px;text-transform:uppercase;}
  .badge.ok{background:rgba(75,107,82,0.12);color:var(--ok);}
  .badge.warn{background:rgba(156,124,62,0.14);color:var(--warn);}
  .badge.danger{background:rgba(140,74,61,0.13);color:var(--danger);}
  .badge.neutral{background:var(--line);color:var(--black);}
  .badge.navy{background:var(--navy);color:#fff;}
  button.badge{border:none;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:rgba(0,0,0,0.015);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
  .table-wrap table{min-width:640px;}
  .table-wrap.compact table{min-width:520px;}

  /* mobile: turn key tables into stacked cards instead of forcing horizontal scroll */
  @media(max-width:680px){
    .table-wrap.stack-mobile table{min-width:0;width:100%;}
    .table-wrap.stack-mobile thead{display:none;}
    .table-wrap.stack-mobile tbody tr{display:block;border-bottom:6px solid var(--off);padding:12px 12px 10px;}
    .table-wrap.stack-mobile tbody tr:last-child{border-bottom:none;}
    .table-wrap.stack-mobile td{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:7px 0;}
    .table-wrap.stack-mobile td:last-child{border-bottom:none;}
    .table-wrap.stack-mobile td[data-label]::before{content:attr(data-label);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--steel);flex-shrink:0;}
    .table-wrap.stack-mobile td.td-title{display:block;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px;}
    .table-wrap.stack-mobile td.td-title::before{content:none;}
    .table-wrap.stack-mobile td select, .table-wrap.stack-mobile td input{width:auto;flex:1;max-width:60%;}
  }

  .attn-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .attn-row:last-child{border-bottom:none;}
  .attn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--steel);}
  .attn-dot.danger{background:var(--danger);} .attn-dot.warn{background:var(--warn);}
  .attn-main{flex:1;min-width:0;}
  .attn-title{font-size:13px;font-weight:600;}
  .attn-meta{font-size:11.5px;color:var(--steel);margin-top:1px;}

  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.03em;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--black);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .search-input{border:1px solid var(--line);padding:8px 12px;border-radius:var(--radius);font-size:13px;min-width:180px;background:#fff;}
  select.sel, input.field, textarea.field{border:1px solid var(--line);padding:8px 10px;border-radius:var(--radius);font-size:13px;background:#fff;width:100%;}
  label.flabel{font-size:11px;color:var(--steel);letter-spacing:0.02em;display:block;margin-bottom:4px;}
  .field-row{margin-bottom:12px;}
  .form-section{margin-bottom:16px;}
  .form-section-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--sage);margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;}

  #modal-backdrop{position:fixed;inset:0;background:rgba(21,37,61,0.45);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:36px 16px;overflow-y:auto;}
  #modal-backdrop.open{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);max-width:600px;width:100%;padding:24px;}
  .modal.wide{max-width:760px;}
  .modal h3{margin:0 0 4px;font-size:19px;}
  .modal .modal-sub{font-size:13px;color:var(--steel);margin-bottom:18px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap;}
  .modal-foot .spacer{flex:1;}
  .modal-tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto;}
  .modal-tab{padding:9px 13px;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;color:var(--steel);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;}
  .modal-tab.active{color:var(--navy);border-bottom-color:var(--sage);background:rgba(112,128,120,0.08);}
  @media(max-width:767px){
    #modal-backdrop{align-items:flex-end;padding:0;}
    .modal{max-width:100%;border-radius:16px 16px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:sheetUp .22s ease-out;}
    .modal::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
    .modal h3{font-size:18px;}
    .modal-foot{position:sticky;bottom:-20px;background:#fff;margin-left:-18px;margin-right:-18px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));}
  }
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:12.5px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;}
  #toast.show{opacity:1;}

  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .kanban-col{background:#F1EFE6;border:1px solid var(--line);border-radius:var(--radius);min-width:200px;flex:1;padding:10px;}
  .kanban-col h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--steel);margin:0 0 8px;display:flex;justify-content:space-between;}
  .kanban-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;margin-bottom:8px;font-size:12.5px;cursor:pointer;}
  .kanban-card:hover{border-color:var(--sage);}
  .kanban-card .kc-owner{font-size:10.5px;color:var(--steel);margin-top:4px;display:flex;justify-content:space-between;}

  .fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
  .fdot{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}

  .empty-state{text-align:center;padding:34px 20px;color:var(--steel);}
  .empty-state .es-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--black);margin-bottom:6px;}
  .empty-state .es-body{font-size:12.5px;max-width:360px;margin:0 auto 14px;}

  .swatch{height:74px;border-radius:2px;display:flex;align-items:flex-end;padding:8px;position:relative;}
  .swatch span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);}

  #mobilenav{display:none;}
  @media(max-width:880px){
    #sidebar{display:none;}
    #main{padding:16px 14px 90px;}
    #mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:150;border-top:1px solid rgba(255,255,255,0.1);}
    .mnav-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;color:rgba(247,245,239,0.62);font-size:10px;font-weight:600;letter-spacing:0.03em;}
    .mnav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;}
    .mnav-item.active{color:#fff;}
    .mnav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2.5px;background:var(--sage-2);border-radius:0 0 2px 2px;}
    .mtopbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:6px;flex-wrap:nowrap;}
    .mtopbar .brand-word{color:var(--navy);font-size:14px;flex-shrink:0;}
    .mtopbar select.sel{max-width:120px;font-size:11px;padding:7px 6px;}
    .mtopbar .btn{padding:8px 10px;font-size:11px;flex-shrink:0;}
    /* larger touch targets on small screens */
    .btn.xs{padding:7px 11px;font-size:12px;min-height:32px;}
    .btn.sm{padding:8px 13px;font-size:12.5px;min-height:34px;}
    .widget-controls button{width:30px;height:30px;font-size:13px;}
    .chip{padding:8px 14px;font-size:12px;}
    select.sel, input.field, textarea.field{font-size:14px;padding:10px;}
    .checklist-item input[type=checkbox]{width:19px;height:19px;}
    td select.sel, td input.field{font-size:13px;padding:8px;}
  }
  #mobiletopbar{display:none;}
  @media(max-width:880px){#mobiletopbar{display:flex;}}

  .qadd-fab{position:fixed;right:20px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--sage);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.25);z-index:160;}
  @media(min-width:881px){.qadd-fab{right:34px;bottom:34px;}}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
  #home-widgets{grid-template-columns:repeat(2,1fr);}
  @media(max-width:880px){ #home-widgets{grid-template-columns:1fr;} #home-widgets .widget-wrap{grid-column:auto !important;} }
  .divider{height:1px;background:var(--line);margin:16px 0;}

  /* widget controls */
  .widget-wrap{position:relative;padding-top:44px;}
  .widget-controls{position:absolute;top:12px;right:12px;display:flex;gap:3px;}
  .widget-controls button{background:transparent;border:1px solid var(--line);color:var(--steel);width:22px;height:22px;font-size:11px;border-radius:2px;line-height:1;}
  .widget-controls button:hover{border-color:var(--navy);color:var(--navy);}

  /* scatter */
  .scatter-wrap{display:flex;gap:6px;}
  .scatter-yaxis{display:flex;flex-direction:column;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--steel);padding:6px 4px 26px 0;text-align:right;}
  .scatter-plot{position:relative;flex:1;height:280px;border-left:1.5px solid var(--black);border-bottom:1.5px solid var(--black);background:#fff;}
  .scatter-tick-x{position:absolute;bottom:-18px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--steel);transform:translateX(-50%);}
  .scatter-gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line);}
  .scatter-quad-label{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.05em;color:var(--steel);opacity:0.55;}
  .scatter-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--navy);cursor:pointer;transform:translate(-50%,50%);border:2px solid #fff;box-shadow:0 0 0 1px var(--navy);}
  .scatter-dot:hover{background:var(--sage);box-shadow:0 0 0 1px var(--sage);}
  .scatter-xaxis-label, .scatter-yaxis-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:var(--black);text-align:center;}

  /* checklist */
  .checklist-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;}
  .checklist-item input[type=checkbox]{width:15px;height:15px;flex-shrink:0;}
  .checklist-item .cl-text.done{text-decoration:line-through;color:var(--steel);}
  .checklist-item .cl-actions{display:flex;gap:2px;margin-left:auto;}

  /* calendar */
  .cal-controls{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .cal-headcell{background:#EFECE2;padding:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;text-align:center;color:var(--steel);}
  .cal-cell{background:#fff;min-height:86px;padding:6px;cursor:pointer;}
  .cal-cell.other-month{background:#FAF9F5;color:var(--steel);}
  .cal-cell.today{background:#F2F0E6;}
  .cal-cell:hover{background:#F7F5EF;}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);}
  .cal-cell.today .cal-daynum{color:var(--navy);font-weight:700;}
  .cal-event{font-size:10px;margin-top:3px;padding:1px 4px;border-radius:2px;background:var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-event.danger{background:rgba(140,74,61,0.16);color:var(--danger);}
  @media(max-width:880px){
    .cal-grid{grid-template-columns:1fr;}
    .cal-headcell{display:none;}
    .cal-cell{min-height:auto;display:flex;justify-content:space-between;align-items:center;padding:10px;}
  }

  /* notes tree */
  .notes-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;}
  @media(max-width:880px){.notes-layout{grid-template-columns:1fr;}}
  .tree{font-size:12.5px;}
  .tree-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:2px;cursor:pointer;}
  .tree-item:hover{background:#F1EFE6;}
  .tree-item.active{background:var(--navy);color:#fff;}
  .tree-children{margin-left:14px;border-left:1px solid var(--line);padding-left:4px;}
  .note-body-render h4{font-size:14px;margin:10px 0 4px;}
  .note-body-render h5{font-size:12.5px;margin:8px 0 4px;color:var(--steel);text-transform:uppercase;letter-spacing:0.04em;}
  .note-body-render ul{margin:4px 0;padding-left:18px;}
  .note-body-render .nb-check{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;cursor:pointer;}
  .note-body-render .nb-check.done{color:var(--steel);text-decoration:line-through;}

  .impact-effort{position:relative;height:260px;}
  .archived-banner{background:#F1EFE6;border:1px solid var(--line);padding:8px 12px;font-size:11.5px;color:var(--steel);border-radius:2px;margin-bottom:12px;}
  .tab-toggle{display:flex;gap:2px;border:1.5px solid var(--navy);border-radius:20px;padding:3px;width:fit-content;background:#fff;}

<script>
/* =========================================================
   AVORA BUSINESS LAUNCH OS — v2
   Shared, editable, collaborative operating tool.
   Persistence: window.storage (shared across founders on this artifact)
   ========================================================= */

const STORAGE_KEY = 'avora-os-state-v2';

function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b) return null; return Math.ceil((new Date(b)-new Date(a))/86400000); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function initials2(name){ return (name||'?').split(' ').map(w=>w[0]).filter(Boolean).join('').slice(0,2).toUpperCase()||'?'; }
const CUR_SYMBOL = {GBP:'£',EUR:'€',USD:'$'};
function curSym(c){ return CUR_SYMBOL[c]||'£'; }
function fmtMoney(n,cur){ cur=cur||STATE.settings.currency; if(n===null||n===undefined||isNaN(n)) return curSym(cur)+'0.00'; const neg=n<0; n=Math.abs(n); return (neg?'-':'')+curSym(cur)+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtMoney0(n,cur){ cur=cur||STATE.settings.currency; if(n===null||n===undefined||isNaN(n)) return curSym(cur)+'0'; return curSym(cur)+Math.round(n).toLocaleString('en-GB'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* ---------------- CLEAN SEED STATE ---------------- */
/* Only confirmed AVORA project facts are pre-filled. Everything else starts empty. */
function seedState(){
  const founders = [
    {id:'f1', name:'Founder 01', role:'Role not set', initials:'F1', primary:[], secondary:[]},
    {id:'f2', name:'Founder 02', role:'Role not set', initials:'F2', primary:[], secondary:[]},
    {id:'f3', name:'Founder 03', role:'Role not set', initials:'F3', primary:[], secondary:[]}
  ];

  // Confirmed from AVORA project storefront: SKU, name, category (where shown), RRP, and the one
  // confirmed spec value (145 GSM for APT-001). Costs, suppliers, fabric composition etc. are NOT
  // invented and are left blank for founders to fill in.
  const products = [
    {id:'p1', sku:'APT-001', name:'Performance T-Shirt', category:'Performance', collection:'Collection 001', status:'Idea', supplierId:'', colourways:['Navy','Off White','Sage','Black'], sizes:['XS','S','M','L','XL','XXL'], fabric:'', composition:'', gsm:145, targetCost:0, actualCost:0, rrp:78, currency:'EUR', moq:0, orderQty:0, sampleStatus:'', fitStatus:'', photography:'', website:'', launch:'', archived:false},
    {id:'p2', sku:'APS-001', name:'Performance Shorts', category:'Performance', collection:'Collection 001', status:'Idea', supplierId:'', colourways:['Navy','Off White','Sage','Black'], sizes:['XS','S','M','L','XL','XXL'], fabric:'', composition:'', gsm:0, targetCost:0, actualCost:0, rrp:92, currency:'EUR', moq:0, orderQty:0, sampleStatus:'', fitStatus:'', photography:'', website:'', launch:'', archived:false},
    {id:'p3', sku:'APQ-001', name:'Quarter Zip', category:'', collection:'Collection 001', status:'Idea', supplierId:'', colourways:['Navy','Sage'], sizes:['XS','S','M','L','XL','XXL'], fabric:'', composition:'', gsm:0, targetCost:0, actualCost:0, rrp:145, currency:'EUR', moq:0, orderQty:0, sampleStatus:'', fitStatus:'', photography:'', website:'', launch:'', archived:false},
    {id:'p4', sku:'AAB-001', name:'Racket Holdall', category:'Accessories', collection:'Collection 001', status:'Idea', supplierId:'', colourways:['Navy'], sizes:['One Size'], fabric:'', composition:'', gsm:0, targetCost:0, actualCost:0, rrp:185, currency:'EUR', moq:0, orderQty:0, sampleStatus:'', fitStatus:'', photography:'', website:'', launch:'', archived:false}
  ];

  const inventory = [];
  products.forEach(p=>p.colourways.forEach(c=>p.sizes.forEach(s=>{
    inventory.push({id:uid('inv'), productId:p.id, colour:c, size:s, opening:0, incoming:0, reserved:0, sold:0, returned:0, damaged:0, samples:0, marketingStock:0});
  })));

  // Launch plan structure kept as the founders' own planning framework — every milestone reset to
  // Not Started with no invented owner or deadline.
  const phaseNames = [
    ['Foundation',12,['Company name & registration','Founder agreement & equity split','Business bank account','Trademark search & application','Terms, privacy & returns policy']],
    ['Brand',12,['Brand strategy & positioning','Primary logo & AV mark','Colour & typography system','Packaging & swing tag design','Brand guidelines document']],
    ['Product Development',16,['Collection architecture finalised','Tech packs — all SKUs','Sample round reviewed','Fit approval — all SKUs','Production order placed']],
    ['Suppliers & Sampling',10,['Manufacturer shortlist & quotes','Preferred manufacturer confirmed','Packaging supplier confirmed']],
    ['Operations',8,['Fulfilment provider selected','SKU & inventory system live','Returns process defined']],
    ['Website',14,['Store platform selected & configured','Product pages built — all SKUs','Payments & shipping tested','Mobile QA complete']],
    ['Content',8,['Campaign photography shot','Launch content calendar built']],
    ['Pre-Launch Marketing',10,['Social accounts live','Email capture live','Padel club partnerships in progress']],
    ['Launch',6,['Final inventory check','Website QA sign-off','Launch day go/no-go']],
    ['Post-Launch',4,['Week 1 sales review','Drop 002 planning kicked off']]
  ];
  const launchPhases = phaseNames.map(([name,weight,ms])=>({
    id:uid('ph'), name, weight,
    milestones: ms.map(m=>({id:uid('m'), name:m, owner:'', deadline:'', status:'Not Started', priority:'Medium', notes:''}))
  }));

  const drops = [
    {id:uid('d'), number:1, name:'Collection 001', description:'Eight pieces. Court-tested construction, cut to be worn away from it.', status:'Planning', launchDate:'', designDeadline:'', samplingDeadline:'', productionDeadline:'', photographyDeadline:'', contentDeadline:'', campaignStart:'', budget:0, productIds:['p1','p2','p3','p4'], colourways:[], owner:'', secondaryOwner:'', notes:'', archived:false}
  ];

  const responsibilities = {
    areas:['Brand','Product','Manufacturing','Suppliers','Finance','Operations','Website','Marketing','Social Media','Content','Partnerships','Customer Experience','Legal/Admin'],
    assignments:{}
  };

  const brandColours = [
    {id:'c1', name:'AVORA Navy', hex:'#15253D', role:'Primary — navigation, headlines', status:'Core', group:'Core Palette'},
    {id:'c2', name:'Steel Grey', hex:'#A7ADB3', role:'Secondary information', status:'Core', group:'Core Palette'},
    {id:'c3', name:'Off White', hex:'#F7F5EF', role:'Background', status:'Core', group:'Core Palette'},
    {id:'c4', name:'Black', hex:'#202226', role:'Typography', status:'Core', group:'Core Palette'},
    {id:'c5', name:'Sage Green', hex:'#708078', role:'Accent — used selectively', status:'Core', group:'Core Palette'}
  ];
  const brandLogos = [
    {id:uid('lg'), name:'Primary Wordmark', type:'Primary Wordmark', version:'v1', status:'Approved', notes:'Established brand asset — do not redesign without founder approval.', date:'', approvedBy:'', archived:false},
    {id:uid('lg'), name:'AV Performance Mark', type:'Secondary Mark', version:'v1', status:'Approved', notes:'Established brand asset — for labels, hardware and small-format use.', date:'', approvedBy:'', archived:false}
  ];

  return {
    settings:{ founders, launchDate:'', currency:'GBP', lowStockThreshold:15, marginTarget:65, vatRegistered:false },
    ui:{ activeFounderId:'all', homeMode:'team',
      teamWidgetOrder:['readiness','attention','upcoming','founderWorkload','budget','productStatus','drops','decisions'], teamWidgetHidden:[],
      myWidgetOrder:['myPriorities','myTasks','myOverdue','myUpcoming','mySupplierFollowups','myProjects','myNotes','waitingOnMe'], myWidgetHidden:[],
      taskView:'list', taskTab:'tasks',
      calMode:'month', calYear:new Date().getFullYear(), calMonth:new Date().getMonth(),
      notesSelectedFolder:'root', ideaFilter:{}, brandTab:'overview', dropsView:'card'
    },
    tasks:[], launchPhases, products, inventory, suppliers:[], purchaseOrders:[], drops,
    marketing:{content:[]}, ideas:[], decisions:[], risks:[], budget:[], founderContributions:[],
    responsibilities,
    notes:{ folders:[{id:'root', name:'Notes', parentId:null}, {id:'inbox', name:'Inbox', parentId:'root'}], items:[] },
    brand:{ colours:brandColours, logos:brandLogos, mockups:[], notes:'' },
    calendarEvents:[]
  };
}

/* ---------------- STATE / PERSISTENCE ---------------- */
/* Works two ways depending on where this file is running:
   - Inside a Claude artifact: uses window.storage (shared across everyone viewing this artifact).
   - Hosted anywhere else (e.g. Netlify): falls back to this browser's own localStorage.
     That means each device/browser keeps its own separate copy of the data — it will NOT
     automatically sync between founders unless they're all viewing the same Claude artifact. */
let STATE=null, currentView='home';
const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined' && typeof window.storage !== 'undefined');

async function loadState(){
  try{
    if(HAS_ARTIFACT_STORAGE){
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){ STATE = JSON.parse(res.value); migrateState(); return; }
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ STATE = JSON.parse(raw); migrateState(); return; }
    }
    STATE = seedState(); await saveState();
  }catch(e){ STATE = seedState(); }
}
function migrateState(){
  // ensure any newly-added fields exist on older saved state
  const seed = seedState();
  if(!STATE.responsibilities) STATE.responsibilities = seed.responsibilities;
  if(!STATE.notes) STATE.notes = seed.notes;
  if(!STATE.brand) STATE.brand = seed.brand;
  if(!STATE.calendarEvents) STATE.calendarEvents = [];
  if(!STATE.ui.teamWidgetOrder) Object.assign(STATE.ui, {teamWidgetOrder:seed.ui.teamWidgetOrder, teamWidgetHidden:[], myWidgetOrder:seed.ui.myWidgetOrder, myWidgetHidden:[]});
  if(STATE.ui.calYear===undefined){ STATE.ui.calYear=new Date().getFullYear(); STATE.ui.calMonth=new Date().getMonth(); STATE.ui.calMode='month'; }
  if(!STATE.ui.taskTab) STATE.ui.taskTab='tasks';
  if(!STATE.ui.brandTab) STATE.ui.brandTab='overview';
  if(!STATE.ui.dropsView) STATE.ui.dropsView='card';
  STATE.tasks.forEach(t=>{ if(!t.subtasks) t.subtasks=[]; if(t.support===undefined) t.support=[]; });
}
let saveTimer=null;
async function saveState(){
  try{
    if(HAS_ARTIFACT_STORAGE){ await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), true); }
    else{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  }catch(e){ console.error('storage error', e); }
}
function persist(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveState,250); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------------- NAV ---------------- */
const NAV = [
  {id:'home',num:'01',label:'Home'},{id:'tasks',num:'02',label:'Tasks'},{id:'launch',num:'03',label:'Launch Plan'},
  {id:'products',num:'04',label:'Products'},{id:'inventory',num:'05',label:'Inventory'},{id:'finance',num:'06',label:'Finance'},
  {id:'suppliers',num:'07',label:'Suppliers'},{id:'drops',num:'08',label:'Product Drops'},{id:'marketing',num:'09',label:'Marketing & Content'},
  {id:'ideas',num:'10',label:'Ideas & Decisions'},{id:'calendar',num:'11',label:'Calendar'},{id:'notes',num:'12',label:'Notes'},
  {id:'brand',num:'13',label:'Brand Lab'},{id:'settings',num:'14',label:'Settings'}
];
function renderSidebar(){
  document.getElementById('navlist').innerHTML = NAV.map(n=>`<div class="nav-item ${currentView===n.id?'active':''}" data-nav="${n.id}"><span class="nav-num">${n.num}</span>${esc(n.label)}</div>`).join('');
  document.querySelectorAll('#navlist .nav-item').forEach(el=>el.addEventListener('click',()=>go(el.dataset.nav)));
  renderFounderSelect(document.getElementById('global-founder-select'));
  renderFounderSelect(document.getElementById('global-founder-select-mobile'));
  document.querySelectorAll('.mnav-item').forEach(el=>{ el.classList.toggle('active', el.dataset.nav===currentView); });
}
function renderFounderSelect(sel){
  if(!sel) return;
  sel.innerHTML = `<option value="all">All founders</option>` + STATE.settings.founders.map(f=>`<option value="${f.id}" ${STATE.ui.activeFounderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('');
  sel.value = STATE.ui.activeFounderId;
  sel.onchange = e=>{ STATE.ui.activeFounderId=e.target.value; persist(); render(); };
}
function go(view){ currentView=view; render(); window.scrollTo(0,0); }
document.querySelectorAll('.mnav-item').forEach(el=>{
  el.addEventListener('click', ()=>{ if(el.dataset.nav==='more'){ openMobileMenu(); } else go(el.dataset.nav); });
});
function openMobileMenu(){
  openModal(`<h3>Menu</h3><div class="modal-sub">Jump to any area</div>
    <div style="display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow-y:auto;">
      ${NAV.map(n=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:2px;${currentView===n.id?'background:var(--navy);border-color:var(--navy);':''}" onclick="go('${n.id}');closeModal();">
        <span class="mono" style="font-size:11px;color:${currentView===n.id?'var(--sage-2)':'var(--steel)'};width:20px;flex-shrink:0;">${n.num}</span>
        <span style="font-size:14px;font-weight:600;color:${currentView===n.id?'#fff':'var(--black)'};">${esc(n.label)}</span>
      </div>`).join('')}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

/* ---------------- SHARED HELPERS ---------------- */
function founderName(id){ const f=STATE.settings.founders.find(x=>x.id===id); return f?f.name:'Unassigned'; }
function ownerOptions(sel,allowEmpty){ return (allowEmpty!==false?'<option value="">Unassigned</option>':'')+STATE.settings.founders.map(f=>`<option value="${f.id}" ${sel===f.id?'selected':''}>${esc(f.name)}</option>`).join(''); }
function productOptions(sel){ return '<option value="">—</option>'+STATE.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${p.sku} — ${esc(p.name)}</option>`).join(''); }
function supplierOptions(sel){ return '<option value="">—</option>'+STATE.suppliers.filter(s=>!s.archived).map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join(''); }
function dropOptions(sel){ return '<option value="">—</option>'+STATE.drops.filter(d=>!d.archived).map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${esc(d.name)}</option>`).join(''); }
function matchesFounder(id){ return STATE.ui.activeFounderId==='all' || id===STATE.ui.activeFounderId || (Array.isArray(id) && id.includes(STATE.ui.activeFounderId)); }
function emptyState(title, body, actionLabel, actionFn){
  return `<div class="empty-state"><div class="es-title mono">${esc(title)}</div><div class="es-body">${esc(body)}</div>${actionLabel?`<button class="btn ghost sm" onclick="${actionFn}">${esc(actionLabel)}</button>`:''}</div>`;
}
function confirmDelete(label, cb){
  openModal(`<h3>Delete this ${esc(label)}?</h3><div class="modal-sub">This action cannot be undone.</div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="(${cb.toString()})();closeModal();">Delete</button></div>`);
}

/* ---------------- CALCULATIONS ---------------- */
function computeReadiness(){
  const total = STATE.launchPhases.reduce((s,p)=>s+p.weight,0) || 1;
  let weighted=0;
  const perPhase = STATE.launchPhases.map(p=>{
    const ms=p.milestones;
    const val = ms.length ? ms.reduce((s,m)=>s+(m.status==='Complete'?1:m.status==='In Progress'?0.5:m.status==='Review'?0.75:0),0)/ms.length : 0;
    weighted += val*p.weight;
    return {name:p.name, pct:Math.round(val*100)};
  });
  return {overall:Math.round((weighted/total)*100), perPhase};
}
function productLandedCost(p){
  const base = p.actualCost||p.targetCost||0;
  const freight = base*0.06, duty = base*0.02, packaging = base>0?0.65:0;
  return {base,freight,duty,packaging,landed:base+freight+duty+packaging};
}
function productMargin(p){
  const {landed} = productLandedCost(p);
  const rrp=p.rrp||0;
  const netRevenue = STATE.settings.vatRegistered ? rrp/1.2 : rrp;
  const profit = netRevenue-landed;
  const marginPct = netRevenue>0 ? (profit/netRevenue*100) : 0;
  const markupPct = landed>0 ? (profit/landed*100) : 0;
  return {landed,netRevenue,profit,marginPct,markupPct};
}
function inventoryAvailable(r){ return r.opening+r.incoming-r.reserved-r.sold-r.damaged-r.samples-r.marketingStock; }
function productStockTotal(id){ return STATE.inventory.filter(r=>r.productId===id).reduce((s,r)=>s+inventoryAvailable(r),0); }
function budgetTotals(){
  const totalBudget = STATE.budget.reduce((s,b)=>s+Number(b.budget||0),0);
  const totalActual = STATE.budget.reduce((s,b)=> s+(b.paid?Number(b.actual||0):0),0);
  const totalCommitted = STATE.budget.reduce((s,b)=> s+(!b.paid?Number(b.actual||b.budget||0):0),0);
  const remaining = totalBudget-totalActual-totalCommitted;
  return {totalBudget,totalActual,totalCommitted,remaining, pctUsed: totalBudget?Math.round(((totalActual+totalCommitted)/totalBudget)*100):0};
}
function founderBalances(){
  const bal={}; STATE.settings.founders.forEach(f=>bal[f.id]={contributed:0,personallyPaid:0});
  STATE.founderContributions.forEach(c=>{ if(!bal[c.founder]) return; if(c.type==='Expense Paid Personally') bal[c.founder].personallyPaid+=Number(c.amount||0); else bal[c.founder].contributed+=Number(c.amount||0); });
  return bal;
}
function taskProgress(t){ if(!t.subtasks||!t.subtasks.length) return null; const done=t.subtasks.filter(s=>s.done).length; return {done,total:t.subtasks.length}; }
function allEvents(){
  const ev=[];
  const today=todayISO();
  STATE.tasks.forEach(t=>{ if(t.due && t.status!=='Complete') ev.push({date:t.due, title:t.name, type:'Task', sev: t.due<today?'danger':'', ref:{kind:'task',id:t.id}}); });
  STATE.launchPhases.forEach(p=>p.milestones.forEach(m=>{ if(m.deadline && m.status!=='Complete') ev.push({date:m.deadline, title:m.name+' — '+p.name, type:'Launch', sev:m.deadline<today?'danger':'', ref:{kind:'milestone',phaseId:p.id,id:m.id}}); }));
  STATE.drops.filter(d=>!d.archived).forEach(d=>{
    [['launchDate','Launch — '],['designDeadline','Design deadline — '],['samplingDeadline','Sampling deadline — '],['productionDeadline','Production deadline — '],['photographyDeadline','Photography deadline — '],['contentDeadline','Content deadline — '],['campaignStart','Campaign start — ']].forEach(([f,label])=>{
      if(d[f]) ev.push({date:d[f], title:label+d.name, type:'Product', sev:'', ref:{kind:'drop',id:d.id}});
    });
  });
  STATE.marketing.content.forEach(c=>{ if(c.publishDate) ev.push({date:c.publishDate, title:c.title, type:'Content', sev:'', ref:{kind:'content',id:c.id}}); });
  STATE.calendarEvents.forEach(c=>ev.push({date:c.date, title:c.title, type:c.type||'Other', sev:'', ref:{kind:'manual',id:c.id}, notes:c.notes}));
  return ev;
}
function attentionItems(){
  const items=[]; const today=todayISO();
  STATE.tasks.forEach(t=>{
    if(t.status!=='Complete' && t.due && t.due<today) items.push({sev:'danger', title:t.name, meta:`Overdue task · ${founderName(t.owner)} · due ${fmtDate(t.due)}`, go:'tasks'});
    else if(t.status==='Blocked') items.push({sev:'warn', title:t.name, meta:`Blocked · ${founderName(t.owner)}`, go:'tasks'});
  });
  STATE.launchPhases.forEach(p=>p.milestones.forEach(m=>{ if(m.status!=='Complete' && m.deadline && m.deadline<today) items.push({sev:'danger', title:m.name, meta:`Overdue milestone · ${p.name}`, go:'launch'}); }));
  STATE.inventory.forEach(r=>{ const avail=inventoryAvailable(r); if(avail<=STATE.settings.lowStockThreshold && avail>0){ const prod=STATE.products.find(p=>p.id===r.productId); if(prod) items.push({sev:'warn', title:`Low stock — ${prod.sku} ${r.colour} ${r.size}`, meta:`${avail} units available`, go:'inventory'}); } });
  STATE.decisions.forEach(d=>{ if(!d.archived && (d.status==='Discussion'||d.status==='Proposed')) items.push({sev:'warn', title:`Unresolved decision — ${d.decision}`, meta:`${d.status} · ${d.area}`, go:'ideas'}); });
  STATE.risks.forEach(r=>{ if(r.status==='Active' && r.impact==='Critical') items.push({sev:'danger', title:`Critical risk — ${r.risk}`, meta:`Owner ${founderName(r.owner)}`, go:'home'}); });
  const b=budgetTotals(); if(b.totalBudget>0 && b.pctUsed>=90) items.push({sev:'danger', title:'Budget nearly exhausted', meta:`${b.pctUsed}% committed or spent`, go:'finance'});
  STATE.suppliers.forEach(s=>{ if(s.status==='Testing') items.push({sev:'warn', title:`Follow up — ${s.name}`, meta:'Supplier still in testing status', go:'suppliers'}); });
  return items;
}

function render(){

const TEAM_WIDGET_DEFS = {
  readiness:{label:'Launch Readiness', render:renderWidgetReadiness},
  attention:{label:'Needs Attention', render:renderWidgetAttention},
  upcoming:{label:'Upcoming Deadlines', render:renderWidgetUpcoming},
  founderWorkload:{label:'Founder Workload', render:renderWidgetFounderWorkload},

  myPriorities:{label:'My Priorities', render:renderWidgetMyPriorities},

};

function renderHome(){
  const mode = STATE.ui.homeMode;
  const focusFounder = STATE.ui.activeFounderId!=='all' ? STATE.ui.activeFounderId : (mode==='my'? (STATE.settings.founders[0]?.id||'') : null);
  const title = mode==='my' ? `${founderName(focusFounder)} — Workspace` : 'Business Launch OS';
  const defs = mode==='my' ? MY_WIDGET_DEFS : TEAM_WIDGET_DEFS;
  const order = mode==='my' ? STATE.ui.myWidgetOrder : STATE.ui.teamWidgetOrder;
  const hidden = mode==='my' ? STATE.ui.myWidgetHidden : STATE.ui.teamWidgetHidden;
  const visible = order.filter(id=>defs[id] && !hidden.includes(id));

  return `
  <div class="page-header">
    <div><div class="page-eyebrow mono">Avora / Storefront — Home</div><div class="page-title">${esc(title)}</div><div class="page-subtitle">${mode==='my'? 'Your priorities, tasks and deadlines.' : 'Where AVORA stands right now.'}</div></div>
    <div class="page-actions">
      <div class="tab-toggle">
        <div class="tt-item ${mode==='team'?'active':''}" onclick="setHomeMode('team')">TEAM VIEW</div>
        <div class="tt-item ${mode==='my'?'active':''}" onclick="setHomeMode('my')">MY VIEW</div>
      </div>
      <button class="btn ghost sm" onclick="openCustomiseDashboard()">Customise dashboard</button>
    </div>
  </div>
  <div class="grid grid-2" id="home-widgets">
    ${visible.length? visible.map((id,idx)=>renderWidgetWrap(id, idx, visible.length, mode, defs[id])).join('') : emptyState('No widgets visible','All widgets are hidden for this view.','Customise dashboard',"openCustomiseDashboard()")}
  </div>
  `;
}
function renderWidgetWrap(id, idx, total, mode, def){
  return `<div class="card widget-wrap" style="${(id==='attention'||id==='budget'||id==='founderWorkload')?'grid-column: span 2;':''}">
    <div class="widget-controls">
      <button title="Move up" ${idx===0?'disabled':''} onclick="moveWidget('${mode}','${id}',-1)">↑</button>
      <button title="Move down" ${idx===total-1?'disabled':''} onclick="moveWidget('${mode}','${id}',1)">↓</button>
      <button title="Hide widget" onclick="hideWidget('${mode}','${id}')">✕</button>
    </div>
    ${def.render()}
  </div>`;
}
function setHomeMode(m){ STATE.ui.homeMode=m; persist(); render(); }
function moveWidget(mode,id,dir){
  const key = mode==='my'?'myWidgetOrder':'teamWidgetOrder';
  const arr = STATE.ui[key]; const i=arr.indexOf(id); const j=i+dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; persist(); render();
}
function hideWidget(mode,id){
  const key = mode==='my'?'myWidgetHidden':'teamWidgetHidden';
  if(!STATE.ui[key].includes(id)) STATE.ui[key].push(id);
  persist(); render();
}
function openCustomiseDashboard(){
  const mode = STATE.ui.homeMode;
  const defs = mode==='my'?MY_WIDGET_DEFS:TEAM_WIDGET_DEFS;
  const order = mode==='my'?STATE.ui.myWidgetOrder:STATE.ui.teamWidgetOrder;
  const hidden = mode==='my'?STATE.ui.myWidgetHidden:STATE.ui.teamWidgetHidden;
  openModal(`<h3>Customise dashboard</h3><div class="modal-sub">${mode==='my'?'My View':'Team View'} widgets — show, hide and reorder</div>
    <div style="display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;">
      ${order.map((id,idx)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;${hidden.includes(id)?'opacity:0.45;':''}">
          <span style="flex:1;font-size:13px;">${esc(defs[id]?defs[id].label:id)}</span>
          <button class="btn ghost xs" ${idx===0?'disabled':''} onclick="moveWidget('${mode}','${id}',-1);openCustomiseDashboard();">↑</button>
          <button class="btn ghost xs" ${idx===order.length-1?'disabled':''} onclick="moveWidget('${mode}','${id}',1);openCustomiseDashboard();">↓</button>
          <button class="btn ${hidden.includes(id)?'':'ghost'} xs" onclick="toggleWidgetVisible('${mode}','${id}');openCustomiseDashboard();">${hidden.includes(id)?'Restore':'Hide'}</button>
        </div>
      `).join('')}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal();render();">Done</button></div>`);
}
function toggleWidgetVisible(mode,id){
  const key = mode==='my'?'myWidgetHidden':'teamWidgetHidden';
  const arr = STATE.ui[key];
  const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  persist();
}

/* ================= TASKS ================= */
let taskFilter = {status:'All', view:'All Tasks', q:''};
function renderTasks(){
  const tab = STATE.ui.taskTab;
  return `
  <div class="page-header">
    <div><div class="page-eyebrow mono">Avora / Operations</div><div class="page-title">Tasks</div><div class="page-subtitle">See what needs doing, who owns it, and what's overdue.</div></div>
    <div class="page-actions">${tab==='tasks'?`<button class="btn" onclick="openTaskModal()">+ Add task</button>`:''}</div>
  </div>
  <div class="tab-toggle" style="margin-bottom:18px;">
    <div class="tt-item ${tab==='tasks'?'active':''}" onclick="setTaskTab('tasks')">TASKS</div>
    <div class="tt-item ${tab==='responsibilities'?'active':''}" onclick="setTaskTab('responsibilities')">RESPONSIBILITIES</div>
    <div class="tt-item ${tab==='workload'?'active':''}" onclick="setTaskTab('workload')">TEAM WORKLOAD</div>
  </div>
  ${tab==='tasks'?renderTaskList():tab==='responsibilities'?renderResponsibilityMatrix():renderTeamWorkload()}
  `;
}
function setTaskTab(t){ STATE.ui.taskTab=t; render(); }
function renderTaskList(){
  const views = ['All Tasks','My Tasks','By Founder','Today','This Week','Upcoming','Overdue','Blocked','Completed'];
  const today = todayISO();
  const weekEnd = addDays(7);
  let list = STATE.tasks.filter(t=>{
    if(STATE.ui.activeFounderId!=='all' && t.owner!==STATE.ui.activeFounderId && !(t.support||[]).includes(STATE.ui.activeFounderId)) return false;
    if(taskFilter.q && !t.name.toLowerCase().includes(taskFilter.q.toLowerCase())) return false;
    switch(taskFilter.view){
      case 'My Tasks': return STATE.ui.activeFounderId!=='all' ? true : true;
      case 'Today': return t.due===today && t.status!=='Complete';
      case 'This Week': return t.due && t.due>=today && t.due<=weekEnd && t.status!=='Complete';
      case 'Upcoming': return t.due && t.due>today && t.status!=='Complete';
      case 'Overdue': return t.due && t.due<today && t.status!=='Complete';
      case 'Blocked': return t.status==='Blocked';
      case 'Completed': return t.status==='Complete';
      default: return true;
    }
  }).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

  if(!STATE.tasks.length){
    return emptyState('No tasks yet','Break the launch down into ownable tasks — assigned, dated, and trackable.','+ Create task',"openTaskModal()");
  }

  return `
  <div class="filter-row">
    ${views.map(v=>`<div class="chip ${taskFilter.view===v?'active':''}" onclick="setTaskFilter('view','${v}')">${v}</div>`).join('')}
    <input class="search-input" placeholder="Search tasks..." value="${esc(taskFilter.q)}" oninput="setTaskFilter('q',this.value)">
    <div class="tab-toggle" style="margin-left:auto;">
      <div class="tt-item ${STATE.ui.taskView==='list'?'active':''}" onclick="setTaskView('list')">LIST</div>
      <div class="tt-item ${STATE.ui.taskView==='kanban'?'active':''}" onclick="setTaskView('kanban')">KANBAN</div>
    </div>
  </div>
  ${STATE.ui.taskView==='list'? renderTaskTable(list) : renderTaskKanban(list)}
  `;
}
function renderTaskTable(list){
  if(!list.length) return emptyState('No tasks match this filter','','Clear filters',"taskFilter={status:'All',view:'All Tasks',q:''};render();");
  return `<div class="table-wrap stack-mobile"><table>
    <thead><tr><th>Task</th><th>Owner</th><th>Area</th><th>Priority</th><th>Status</th><th>Due</th><th></th></tr></thead>
    <tbody>
    ${list.map(t=>{ const prog=taskProgress(t); return `
      <tr style="cursor:pointer;" onclick="openTaskModal('${t.id}')">
        <td class="td-title"><strong>${esc(t.name)}</strong>${prog?`<div class="stat-sub">${prog.done}/${prog.total} subtasks complete</div>`:''}</td>
        <td data-label="Owner" onclick="event.stopPropagation();"><span class="fchip"><span class="fdot">${initials2(founderName(t.owner))}</span></span></td>
        <td data-label="Area">${esc(t.area)}</td>
        <td data-label="Priority"><span class="badge ${t.priority==='Critical'?'danger':t.priority==='High'?'warn':'neutral'}">${t.priority}</span></td>
        <td data-label="Status" onclick="event.stopPropagation();">
          <select class="sel" style="padding:4px 6px;font-size:11.5px;" onchange="updateTask('${t.id}','status',this.value)">
            ${['Backlog','Not Started','In Progress','Waiting','Blocked','Review','Complete'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
        <td data-label="Due" class="mono" style="${t.due && t.due<todayISO() && t.status!=='Complete'?'color:var(--danger);':''}">${fmtDate(t.due)}</td>
        <td onclick="event.stopPropagation();"><button class="btn ghost sm" onclick="archiveTask('${t.id}')">Archive</button></td>
      </tr>`;}).join('')}
    </tbody></table></div>`;
}
function renderTaskKanban(list){
  const cols = ['Backlog','Not Started','In Progress','Waiting','Blocked','Review','Complete'];
  return `<div class="kanban">${cols.map(col=>{
    const items = list.filter(t=>t.status===col);
    return `<div class="kanban-col"><h4>${col} <span>${items.length}</span></h4>
      ${items.map(t=>`<div class="kanban-card" onclick="openTaskModal('${t.id}')"><div>${esc(t.name)}</div><div class="kc-owner"><span>${founderName(t.owner)}</span><span>${fmtDate(t.due)}</span></div></div>`).join('')}
    </div>`;
  }).join('')}</div>`;
}
function setTaskFilter(k,v){ taskFilter[k]=v; render(); }
function setTaskView(v){ STATE.ui.taskView=v; render(); }
function updateTask(id,field,value){ const t=STATE.tasks.find(x=>x.id===id); if(t){ t[field]=value; if(field==='status'&&value==='Complete') t.completed=todayISO(); persist(); render(); } }
function archiveTask(id){ confirmDelete('task', ()=>{ STATE.tasks=STATE.tasks.filter(t=>t.id!==id); persist(); render(); showToast('Task deleted'); }); }

function openTaskModal(id){
  const t = id ? STATE.tasks.find(x=>x.id===id) : {id:'', name:'', description:'', owner:'', support:[], area:'', project:'', productId:'', supplierId:'', dropId:'', priority:'Medium', status:'Not Started', start:'', due:'', effort:'', dependencies:'', recurring:false, subtasks:[], notes:'', blocker:'', created:todayISO(), completed:''};
  const isNew = !id;
  openModal(`
    <h3>${isNew?'Add task':'Edit task'}</h3>
    <div class="field-row"><label class="flabel">What needs doing?</label><input class="field" id="tm-name" value="${esc(t.name)}" placeholder="e.g. Contact packaging suppliers"></div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Who?</label><select class="sel" id="tm-owner">${ownerOptions(t.owner)}</select></div>
      <div class="field-row"><label class="flabel">Due</label><input class="field" type="date" id="tm-due" value="${t.due||''}"></div>
    </div>
    <div class="field-row"><label class="flabel">Priority</label><select class="sel" id="tm-priority">${['Critical','High','Medium','Low'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>

    <button type="button" class="btn ghost sm" id="tm-details-toggle" onclick="toggleTaskDetails()" style="margin:6px 0 4px;">+ Add details</button>
    <div id="tm-details" style="display:none;">
      <div class="form-section" style="margin-top:12px;">
        <div class="form-section-title">More about it</div>
        <div class="field-row"><label class="flabel">Description</label><textarea class="field" id="tm-desc" rows="2">${esc(t.description)}</textarea></div>
        <div class="grid grid-2">
          <div class="field-row"><label class="flabel">Status</label><select class="sel" id="tm-status">${['Backlog','Not Started','In Progress','Waiting','Blocked','Review','Complete'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field-row"><label class="flabel">Area</label><input class="field" id="tm-area" value="${esc(t.area)}" placeholder="Product / Brand / Finance..."></div>
        </div>
        <div class="field-row"><label class="flabel">Also involves</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${STATE.settings.founders.map(f=>`<button type="button" class="btn ${((t.support||[]).includes(f.id))?'':'ghost'} xs" data-supp="${f.id}" onclick="toggleModalSupport(this,'${f.id}')">${initials2(f.name)}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">Planning</div>
        <div class="grid grid-3">
          <div class="field-row"><label class="flabel">Start date</label><input class="field" type="date" id="tm-start" value="${t.start||''}"></div>
          <div class="field-row"><label class="flabel">Estimated effort</label><input class="field" id="tm-effort" value="${esc(t.effort)}" placeholder="e.g. 2 hrs"></div>
          <div class="field-row"><label class="flabel">Repeats?</label><select class="sel" id="tm-recurring"><option value="false" ${!t.recurring?'selected':''}>No</option><option value="true" ${t.recurring?'selected':''}>Yes</option></select></div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">Connected to</div>
        <div class="grid grid-3">
          <div class="field-row"><label class="flabel">Product</label><select class="sel" id="tm-product">${productOptions(t.productId)}</select></div>
          <div class="field-row"><label class="flabel">Supplier</label><select class="sel" id="tm-supplier">${supplierOptions(t.supplierId)}</select></div>
          <div class="field-row"><label class="flabel">Drop</label><select class="sel" id="tm-drop">${dropOptions(t.dropId)}</select></div>
        </div>
        <div class="field-row"><label class="flabel">Waiting on</label><input class="field" id="tm-deps" value="${esc(t.dependencies)}" placeholder="e.g. Sample approval"></div>
        <div class="field-row"><label class="flabel">What's blocking it?</label><input class="field" id="tm-blocker" value="${esc(t.blocker)}"></div>
      </div>
      <div class="form-section">
        <div class="form-section-title">Checklist</div>
        <div id="tm-subtasks">${renderSubtaskList(t.subtasks||[])}</div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <input class="field" id="tm-newsubtask" placeholder="Add a step...">
          <button class="btn ghost sm" onclick="addModalSubtask()">Add</button>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">Notes</div>

      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveTaskModal('${t.id}')">${isNew?'Add task':'Save changes'}</button>

  `, true);

function toggleTaskDetails(){
  const box = document.getElementById('tm-details');
  const btn = document.getElementById('tm-details-toggle');
  const open = box.style.display==='none';
  box.style.display = open?'block':'none';
  btn.textContent = open? '– Hide details' : '+ Add details';
}
function toggleModalSupport(btn,fid){
  const i = window._modalSupport.indexOf(fid);
  if(i>=0){ window._modalSupport.splice(i,1); btn.classList.add('ghost'); } else { window._modalSupport.push(fid); btn.classList.remove('ghost'); }
}
function renderSubtaskList(subs){
  if(!subs.length) return `<div class="stat-sub">No subtasks yet.</div>`;
  return subs.map((s,i)=>`
    <div class="checklist-item">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleModalSubtaskDone(${i})">
      <span class="cl-text ${s.done?'done':''}">${esc(s.text)}</span>
      <div class="cl-actions">
        <button class="btn ghost xs" ${i===0?'disabled':''} onclick="moveModalSubtask(${i},-1)">↑</button>
        <button class="btn ghost xs" ${i===subs.length-1?'disabled':''} onclick="moveModalSubtask(${i},1)">↓</button>
        <button class="btn ghost xs" onclick="removeModalSubtask(${i})">✕</button>
      </div>
    </div>`).join('');
}
function refreshModalSubtasks(){ document.getElementById('tm-subtasks').innerHTML = renderSubtaskList(window._modalSubtasks); }
function addModalSubtask(){ const inp=document.getElementById('tm-newsubtask'); const v=inp.value.trim(); if(!v) return; window._modalSubtasks.push({id:uid('st'),text:v,done:false}); inp.value=''; refreshModalSubtasks(); }
function toggleModalSubtaskDone(i){ window._modalSubtasks[i].done=!window._modalSubtasks[i].done; refreshModalSubtasks(); }
function moveModalSubtask(i,dir){ const j=i+dir; if(j<0||j>=window._modalSubtasks.length) return; const a=window._modalSubtasks; [a[i],a[j]]=[a[j],a[i]]; refreshModalSubtasks(); }
function removeModalSubtask(i){ window._modalSubtasks.splice(i,1); refreshModalSubtasks(); }
function saveTaskModal(id){
  const isNew = !id;
  const data = {
    name: document.getElementById('tm-name').value.trim(),
    description: document.getElementById('tm-desc').value,
    owner: document.getElementById('tm-owner').value,
    support: window._modalSupport||[],
    priority: document.getElementById('tm-priority').value,
    status: document.getElementById('tm-status').value,
    area: document.getElementById('tm-area').value||'General',
    start: document.getElementById('tm-start').value,
    due: document.getElementById('tm-due').value,
    effort: document.getElementById('tm-effort').value,
    recurring: document.getElementById('tm-recurring').value==='true',
    productId: document.getElementById('tm-product').value,
    supplierId: document.getElementById('tm-supplier').value,
    dropId: document.getElementById('tm-drop').value,
    dependencies: document.getElementById('tm-deps').value,
    blocker: document.getElementById('tm-blocker').value,
    subtasks: window._modalSubtasks||[],
    notes: document.getElementById('tm-notes').value
  };
  if(!data.name){ showToast('Enter a task title'); return; }
  if(isNew){ STATE.tasks.unshift(Object.assign({id:uid('t'), created:todayISO(), completed:''}, data)); }
  else{ const t=STATE.tasks.find(x=>x.id===id); Object.assign(t,data); if(data.status==='Complete'&&!t.completed) t.completed=todayISO(); }
  persist(); closeModal(); showToast('Task saved'); render();
}
function deleteTaskConfirm(id){ confirmDelete('task', ()=>{ STATE.tasks=STATE.tasks.filter(t=>t.id!==id); persist(); render(); }); }

/* ================= CALENDAR ================= */
function renderCalendar(){
  const mode = STATE.ui.calMode;
  return `<div class="page-header"><div><div class="page-eyebrow mono">Avora / Schedule</div><div class="page-title">Master Calendar</div><div class="page-subtitle">Every deadline, task and event in one view.</div></div>
    <div class="page-actions"><div class="tab-toggle">
      <div class="tt-item ${mode==='month'?'active':''}" onclick="setCalMode('month')">MONTH</div>
      <div class="tt-item ${mode==='week'?'active':''}" onclick="setCalMode('week')">WEEK</div>
      <div class="tt-item ${mode==='agenda'?'active':''}" onclick="setCalMode('agenda')">AGENDA</div>
    </div></div></div>
    ${mode==='month'?renderCalMonth():mode==='week'?renderCalWeek():renderCalAgenda()}
  `;
}
function setCalMode(m){ STATE.ui.calMode=m; render(); }
function renderCalMonth(){
  const y=STATE.ui.calYear, m=STATE.ui.calMonth;
  const first = new Date(y,m,1);
  const daysInMonth = new Date(y,m+1,0).getDate();
  const startWeekday = (first.getDay()+6)%7; // Monday=0
  const prevDays = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push({day:prevDays-startWeekday+1+i, other:true, dateStr:null});
  for(let d=1; d<=daysInMonth; d++) cells.push({day:d, other:false, dateStr:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7!==0) { const idx=cells.length-(startWeekday+daysInMonth); cells.push({day:idx+1, other:true, dateStr:null}); }
  const events = allEvents();
  const eventsByDate = {}; events.forEach(e=>{ eventsByDate[e.date]=eventsByDate[e.date]||[]; eventsByDate[e.date].push(e); });
  const monthLabel = first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const today = todayISO();
  return `
  <div class="cal-controls">
    <button class="btn ghost sm" onclick="calNav(-1)">← Previous</button>
    <button class="btn ghost sm" onclick="calToday()">Today</button>
    <button class="btn ghost sm" onclick="calNav(1)">Next →</button>
    <div style="font-weight:700;font-size:15px;margin-left:8px;">${monthLabel.toUpperCase()}</div>
  </div>
  <div class="cal-grid">
    ${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
    ${cells.map(c=>{
      const evs = c.dateStr ? (eventsByDate[c.dateStr]||[]) : [];
      return `<div class="cal-cell ${c.other?'other-month':''} ${c.dateStr===today?'today':''}" onclick="${c.dateStr?`openDayModal('${c.dateStr}')`:''}">
        <div class="cal-daynum">${c.day}</div>
        <div>${evs.slice(0,3).map(e=>`<div class="cal-event ${e.sev}">${esc(e.title)}</div>`).join('')}${evs.length>3?`<div class="stat-sub">+${evs.length-3} more</div>`:''}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function calNav(dir){ let m=STATE.ui.calMonth+dir, y=STATE.ui.calYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} STATE.ui.calMonth=m; STATE.ui.calYear=y; render(); }
function calToday(){ STATE.ui.calMonth=new Date().getMonth(); STATE.ui.calYear=new Date().getFullYear(); render(); }
function openDayModal(dateStr){
  const events = allEvents().filter(e=>e.date===dateStr);
  openModal(`<h3>${fmtDate(dateStr)}</h3>
    ${events.length? events.map(e=>`<div class="attn-row"><div class="attn-main"><div class="attn-title">${esc(e.title)}</div><div class="attn-meta">${e.type}${e.notes?' · '+esc(e.notes):''}</div></div>${e.ref.kind==='manual'?`<button class="btn ghost sm" onclick="deleteCalEvent('${e.ref.id}')">Delete</button>`:''}</div>`).join('') : `<div class="stat-sub">No events on this day.</div>`}
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="quickAddEventForDate('${dateStr}')">+ Add event</button></div>`);
}
function quickAddEventForDate(dateStr){ closeModal(); quickAddForm('event'); setTimeout(()=>{ const el=document.getElementById('qa-edate'); if(el) el.value=dateStr; },0); }
function deleteCalEvent(id){ STATE.calendarEvents=STATE.calendarEvents.filter(c=>c.id!==id); persist(); closeModal(); render(); }
function renderCalWeek(){
  const now = new Date();
  const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d.toISOString().slice(0,10); });
  const events = allEvents();
  return `<div class="grid grid-4" style="grid-template-columns:repeat(7,1fr);">
    ${days.map(dstr=>{
      const dayEvents = events.filter(e=>e.date===dstr);
      const label = new Date(dstr+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
      return `<div class="card tight" style="${dstr===todayISO()?'border-color:var(--navy);':''}">
        <div class="mono" style="font-size:11px;color:var(--steel);">${label.toUpperCase()}</div>
        ${dayEvents.length? dayEvents.map(e=>`<div class="cal-event ${e.sev}" style="margin-top:6px;">${esc(e.title)}</div>`).join('') : `<div class="stat-sub" style="margin-top:6px;">—</div>`}
        <button class="btn ghost xs" style="margin-top:8px;" onclick="quickAddEventForDate('${dstr}')">+ Add</button>
      </div>`;
    }).join('')}
  </div>`;
}
function renderCalAgenda(){
  const events = allEvents().filter(e=>e.date>=addDays(-3)).sort((a,b)=>a.date.localeCompare(b.date));
  const grouped={}; events.forEach(e=>{ grouped[e.date]=grouped[e.date]||[]; grouped[e.date].push(e); });
  const dates = Object.keys(grouped).slice(0,40);
  return `<div class="card">${dates.length? dates.map(date=>`
    <div style="display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);">
      <div class="mono" style="width:90px;flex-shrink:0;color:var(--steel);font-size:12px;padding-top:2px;">${fmtDate(date)}</div>
      <div style="flex:1;">${grouped[date].map(e=>`<div style="margin-bottom:4px;"><span class="badge ${e.sev||'neutral'}" style="margin-right:8px;">${e.type}</span><span style="font-size:13px;">${esc(e.title)}</span></div>`).join('')}</div>
    </div>`).join('') : emptyState('No upcoming dated items','Add tasks, drop deadlines or calendar events to see them here.')}</div>`;
}

function mdToHtml(md,noteId){
  if(!md) return '<div class="stat-sub">Empty note.</div>';
  const lines = md.split('\n');
  let html=''; let inList=false;
  lines.forEach((line,idx)=>{
    let l = line;
    if(/^#\s+/.test(l)){ if(inList){html+='</ul>';inList=false;} html+=`<h4>${esc(l.replace(/^#\s+/,''))}</h4>`; return; }
    if(/^##\s+/.test(l)){ if(inList){html+='</ul>';inList=false;} html+=`<h5>${esc(l.replace(/^##\s+/,''))}</h5>`; return; }
    const checkMatch = l.match(/^\[( |x|X)\]\s+(.*)/);
    if(checkMatch){ if(inList){html+='</ul>';inList=false;} const done = checkMatch[1].toLowerCase()==='x'; html+=`<div class="nb-check ${done?'done':''}" onclick="toggleNoteCheckbox('${noteId}',${idx})"><input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation()" onchange="toggleNoteCheckbox('${noteId}',${idx})"><span>${esc(checkMatch[2])}</span></div>`; return; }
    if(/^-\s+/.test(l)){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${esc(l.replace(/^-\s+/,''))}</li>`; return; }
    if(inList){html+='</ul>';inList=false;}
    if(l.trim()==='') { html+='<br>'; return; }
    html += `<p style="margin:4px 0;font-size:13px;">${esc(l).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</p>`;
  });
  if(inList) html+='</ul>';
  return html;
}
function toggleNoteCheckbox(noteId, lineIdx){
  const n = STATE.notes.items.find(x=>x.id===noteId);
  const lines = n.body.split('\n');
  const l = lines[lineIdx];
  const m = l.match(/^\[( |x|X)\]\s+(.*)/);
  if(m){ const done = m[1].toLowerCase()==='x'; lines[lineIdx] = `[${done?' ':'x'}] ${m[2]}`; n.body=lines.join('\n'); n.editedDate=todayISO(); persist(); render(); }
}

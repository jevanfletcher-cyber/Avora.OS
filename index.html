  persist(); closeModal(); showToast('Note saved'); render();
}
function duplicateNote(id){ const n=STATE.notes.items.find(x=>x.id===id); const copy=JSON.parse(JSON.stringify(n)); copy.id=uid('n'); copy.title=n.title+' (copy)'; copy.createdDate=todayISO(); copy.editedDate=todayISO(); STATE.notes.items.unshift(copy); persist(); render(); }
function archiveNote(id){ const n=STATE.notes.items.find(x=>x.id===id); n.archived=true; persist(); closeModal(); render(); }

/* ================= BRAND LAB ================= */
function renderBrand(){
  const tab = STATE.ui.brandTab;
  const tabs = [['overview','Overview'],['logos','Logos'],['colour','Colour Lab'],['type','Typography'],['mockups','Mockups'],['assets','Brand Assets'],['notes','Notes']];
  return `<div class="page-header"><div><div class="page-eyebrow mono">Avora / Identity</div><div class="page-title">Brand Lab</div><div class="page-subtitle">Reference and experiment with the AVORA identity.</div></div></div>
  <div class="modal-tabs" style="margin-bottom:20px;">${tabs.map(([k,l])=>`<div class="modal-tab ${tab===k?'active':''}" onclick="setBrandTab('${k}')">${l.toUpperCase()}</div>`).join('')}</div>
  ${ tab==='overview'?renderBrandOverview(): tab==='logos'?renderLogoLab(): tab==='colour'?renderColourLab(): tab==='type'?renderTypeLab(): tab==='mockups'?renderMockupLab(): tab==='assets'?renderBrandAssets(): renderBrandNotes() }
  `;
}
function setBrandTab(t){ STATE.ui.brandTab=t; render(); }
function renderBrandOverview(){
  return `<div class="card" style="background:var(--navy);color:#fff;padding:32px;">
    <div class="mono tracked" style="font-size:11px;color:var(--sage-2);">AVORA / BRAND LINE</div>
    <div style="font-size:26px;font-weight:700;margin-top:8px;line-height:1.25;">Built for the court.<br>Designed for life.</div>
  </div>
  <div class="section-title">Creative principles</div>
  <div class="card"><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;">
    <li>Prioritise simplicity, fit, fabric, movement and detail over branding.</li>
    <li>Keep branding understated and intentional — no oversized logos.</li>
    <li>Avoid generic gymwear and obvious padel clichés.</li>
    <li>Generous negative space, strong typography, editorial composition.</li>
    <li>Build a visual language recognisable without relying solely on the wordmark.</li>
  </ul></div>`;
}
function renderLogoLab(){
  const groups = [['Approved','APPROVED / CURRENT'],['Exploration','EXPLORATION'],['Archived','ARCHIVED']];
  return `<div class="page-actions" style="margin-bottom:16px;"><button class="btn" onclick="openLogoModal()">+ Add logo concept</button></div>
  ${groups.map(([status,label])=>{
    const items = STATE.brand.logos.filter(l=>l.status===status || (status==='Exploration' && (l.status==='Exploring')));
    return `<div class="section-title">${label} <span class="count">${items.length}</span></div>
    ${items.length? `<div class="grid grid-3">${items.map(l=>`<div class="card">
      <div style="display:flex;justify-content:space-between;"><strong style="font-size:13px;">${esc(l.name)}</strong><span class="badge neutral">${esc(l.type)}</span></div>
      <div class="stat-sub">v${esc(l.version)} ${l.date?'· '+fmtDate(l.date):''}</div>
      ${l.notes?`<div class="stat-sub" style="margin-top:6px;">${esc(l.notes)}</div>`:''}
      <div class="divider"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn ghost xs" onclick="openLogoModal('${l.id}')">Edit</button>
        ${status!=='Approved'?`<button class="btn ghost xs" onclick="setLogoStatus('${l.id}','Approved')">Mark approved</button>`:''}
        ${status!=='Archived'?`<button class="btn ghost xs" onclick="setLogoStatus('${l.id}','Archived')">Archive</button>`:''}
      </div>
    </div>`).join('')}</div>` : emptyState(`No ${label.toLowerCase()} logo records`,'')}`;
  }).join('')}`;
}
function openLogoModal(id){
  const l = id? STATE.brand.logos.find(x=>x.id===id) : {id:'',name:'',type:'Experimental',version:'v1',status:'Exploring',notes:'',date:'',approvedBy:''};
  openModal(`<h3>${id?'Edit logo concept':'Add logo concept'}</h3>
    <div class="field-row"><label class="flabel">Name</label><input class="field" id="lg-name" value="${esc(l.name)}" placeholder="e.g. AVORA Secondary Lockup"></div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Type</label><select class="sel" id="lg-type">${['Primary Wordmark','Secondary Mark','Lockup','Icon','Experimental'].map(t=>`<option ${l.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field-row"><label class="flabel">Version</label><input class="field" id="lg-version" value="${esc(l.version)}"></div>
    </div>
    <div class="field-row"><label class="flabel">Status</label><select class="sel" id="lg-status">${['Approved','Exploring','Archived'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field-row"><label class="flabel">Notes / reference description</label><textarea class="field" id="lg-notes" rows="3" placeholder="Describe the concept — image upload isn't supported in this workspace, so use this as the reference record.">${esc(l.notes)}</textarea></div>
    <div class="modal-foot">${id?`<button class="btn danger" onclick="deleteLogo('${l.id}')">Remove</button>`:''}<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLogo('${l.id}')">Save</button></div>`);
}
function saveLogo(id){
  const data = {name:document.getElementById('lg-name').value.trim(), type:document.getElementById('lg-type').value, version:document.getElementById('lg-version').value, status:document.getElementById('lg-status').value, notes:document.getElementById('lg-notes').value};
  if(!data.name){showToast('Enter a name');return;}
  if(!id) STATE.brand.logos.push(Object.assign({id:uid('lg'), date:todayISO(), approvedBy:'', archived:false}, data));
  else Object.assign(STATE.brand.logos.find(x=>x.id===id), data);
  persist(); closeModal(); render();
}
function setLogoStatus(id,status){ const l=STATE.brand.logos.find(x=>x.id===id); l.status=status; persist(); render(); }
function deleteLogo(id){ STATE.brand.logos = STATE.brand.logos.filter(x=>x.id!==id); persist(); closeModal(); render(); }

function renderColourLab(){
  const groups = {};
  STATE.brand.colours.forEach(c=>{ groups[c.group]=groups[c.group]||[]; groups[c.group].push(c); });
  return `<div class="page-actions" style="margin-bottom:16px;"><button class="btn" onclick="openColourModal()">+ Add colour</button></div>
  ${Object.keys(groups).map(g=>`
    <div class="section-title">${g.toUpperCase()} <span class="count">${groups[g].length}</span></div>
    <div class="grid grid-4">${groups[g].map((c,idx)=>`
      <div>
        <div class="swatch" style="background:${c.hex};${c.hex.toUpperCase()==='#F7F5EF'?'border:1px solid var(--line);':''}"><span style="${c.hex.toUpperCase()==='#F7F5EF'?'color:#202226;text-shadow:none;':''}">${c.hex}</span></div>
        <div style="font-size:12.5px;margin-top:6px;font-weight:600;">${esc(c.name)}</div>
        <div class="stat-sub">${esc(c.role)||''}</div>
        <div style="margin-top:4px;"><span class="badge ${c.status==='Core'?'navy':c.status==='Rejected'?'danger':'neutral'}">${esc(c.status)}</span></div>
        <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
          <button class="btn ghost xs" onclick="openColourModal('${c.id}')">Edit</button>
          ${c.status==='Core'? `<button class="btn ghost xs" onclick="moveColourToExploration('${c.id}')">Move to exploration</button>` : `<button class="btn ghost xs" onclick="duplicateColour('${c.id}')">Duplicate</button><button class="btn ghost xs" onclick="deleteColour('${c.id}')">Delete</button>`}
        </div>
      </div>`).join('')}</div>
  `).join('')}
  <div class="section-title">Palette groups</div>
  <div style="display:flex;gap:8px;">
    <input class="field" id="new-group-name" placeholder="e.g. Autumn Capsule" style="max-width:260px;">
    <button class="btn ghost sm" onclick="addPaletteGroup()">Create palette</button>
  </div>`;
}
function openColourModal(id){
  const c = id ? STATE.brand.colours.find(x=>x.id===id) : {id:'',name:'',hex:'#000000',role:'',status:'Exploring',group:'Core Palette'};
  const groups = [...new Set(STATE.brand.colours.map(x=>x.group))];
  openModal(`<h3>${id?'Edit colour':'Add colour'}</h3>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Colour name</label><input class="field" id="cl-name" value="${esc(c.name)}"></div>
      <div class="field-row"><label class="flabel">HEX</label><div style="display:flex;gap:6px;"><input type="color" id="cl-picker" value="${c.hex}" style="width:44px;height:38px;border:1px solid var(--line);padding:2px;"><input class="field" id="cl-hex" value="${c.hex}"></div></div>
    </div>
    <div class="field-row"><label class="flabel">Role</label><input class="field" id="cl-role" value="${esc(c.role)}" placeholder="e.g. Seasonal accent"></div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Status</label><select class="sel" id="cl-status"><option ${c.status==='Core'?'selected':''} ${c.status!=='Core'?'':''}>Core</option><option ${c.status==='Exploring'?'selected':''}>Exploring</option><option ${c.status==='Seasonal'?'selected':''}>Seasonal</option><option ${c.status==='Rejected'?'selected':''}>Rejected</option><option ${c.status==='Archived'?'selected':''}>Archived</option></select></div>
      <div class="field-row"><label class="flabel">Palette group</label><select class="sel" id="cl-group">${groups.map(g=>`<option ${c.group===g?'selected':''}>${g}</option>`).join('')}</select></div>
    </div>
    <div class="modal-foot">${id?`<button class="btn danger" onclick="deleteColour('${c.id}')">Delete</button>`:''}<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveColour('${c.id}')">Save</button></div>`);
  document.getElementById('cl-picker').addEventListener('input', e=>{ document.getElementById('cl-hex').value = e.target.value; });
}
function saveColour(id){
  const data = {name:document.getElementById('cl-name').value.trim(), hex:document.getElementById('cl-hex').value.trim(), role:document.getElementById('cl-role').value, status:document.getElementById('cl-status').value, group:document.getElementById('cl-group').value};
  if(!data.name||!/^#([0-9A-Fa-f]{3}){1,2}$/.test(data.hex)){ showToast('Enter a name and valid hex value'); return; }
  const existing = STATE.brand.colours.find(x=>x.id===id);
  if(existing && existing.status==='Core' && data.status!=='Core'){ /* allowed: explicit move via dropdown counts as intentional */ }
  if(!id) STATE.brand.colours.push(Object.assign({id:uid('col')}, data));
  else Object.assign(existing, data);
  persist(); closeModal(); render();
}
function moveColourToExploration(id){ const c=STATE.brand.colours.find(x=>x.id===id); c.status='Exploring'; persist(); render(); showToast('Moved to exploration'); }
function duplicateColour(id){ const c=STATE.brand.colours.find(x=>x.id===id); const copy={...c,id:uid('col'),name:c.name+' (copy)'}; STATE.brand.colours.push(copy); persist(); render(); }
function deleteColour(id){
  const c = STATE.brand.colours.find(x=>x.id===id);
  if(c.status==='Core'){ showToast('Core colours are moved to exploration, not deleted'); return; }
  confirmDelete('colour', ()=>{ STATE.brand.colours = STATE.brand.colours.filter(x=>x.id!==id); persist(); render(); });
}
function addPaletteGroup(){
  const inp = document.getElementById('new-group-name'); const name = inp.value.trim(); if(!name) return;
  STATE.brand.colours.push({id:uid('col'), name:'New colour', hex:'#708078', role:'', status:'Exploring', group:name});
  persist(); render();
}
function renderTypeLab(){
  return `<div class="card"><div class="stat-label">Typography system</div>
    <div class="stat-sub" style="margin-top:8px;">Bold condensed sans for headlines, tracked monospace for navigation, SKUs, prices and system labels — reinforces performance/technical credibility without needing colour or imagery to do the work.</div>
    <div class="divider"></div>
    <div style="font-size:28px;font-weight:700;letter-spacing:-0.01em;">Built for the court.</div>
    <div class="mono tracked" style="font-size:12px;color:var(--steel);margin-top:8px;">APT-001 · PERFORMANCE T-SHIRT · £78.00</div>
  </div>`;
}
function renderMockupLab(){
  const cats = ['T-Shirt','Shorts','Quarter Zip','Accessories','Packaging','Labels','Website','Social','Campaign','Other'];
  return `<div class="page-actions" style="margin-bottom:16px;"><button class="btn" onclick="openMockupModal()">+ Add mockup</button></div>
  ${STATE.brand.mockups.length? `<div class="grid grid-3">${STATE.brand.mockups.map(mk=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;"><strong style="font-size:13px;">${esc(mk.name)}</strong><span class="badge ${mk.status==='Approved'?'ok':mk.status==='Revision'?'warn':'neutral'}">${esc(mk.status)}</span></div>
      <div class="stat-sub">${esc(mk.category)} · v${esc(mk.version)} · ${founderName(mk.owner)}</div>
      ${mk.feedback?`<div class="stat-sub" style="margin-top:6px;">Feedback: ${esc(mk.feedback)}</div>`:''}
      <div style="margin-top:8px;"><button class="btn ghost xs" onclick="openMockupModal('${mk.id}')">Edit</button></div>
    </div>`).join('')}</div>` : emptyState('No mockups recorded yet','Track garment, packaging and campaign mockups as they move through review.','+ Add mockup',"openMockupModal()")}
  `;
}
function openMockupModal(id){
  const mk = id? STATE.brand.mockups.find(x=>x.id===id) : {id:'',name:'',category:'T-Shirt',status:'Concept',version:'v1',owner:'',notes:'',feedback:''};
  const cats = ['T-Shirt','Shorts','Quarter Zip','Accessories','Packaging','Labels','Website','Social','Campaign','Other'];
  openModal(`<h3>${id?'Edit mockup':'Add mockup'}</h3>
    <div class="field-row"><label class="flabel">Name</label><input class="field" id="mk-name" value="${esc(mk.name)}"></div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Category</label><select class="sel" id="mk-cat">${cats.map(c=>`<option ${mk.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field-row"><label class="flabel">Version</label><input class="field" id="mk-version" value="${esc(mk.version)}"></div>
    </div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Status</label><select class="sel" id="mk-status">${['Concept','Review','Revision','Approved','Archived'].map(s=>`<option ${mk.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field-row"><label class="flabel">Owner</label><select class="sel" id="mk-owner">${ownerOptions(mk.owner)}</select></div>
    </div>
    <div class="field-row"><label class="flabel">Notes</label><textarea class="field" id="mk-notes" rows="2">${esc(mk.notes)}</textarea></div>
    <div class="field-row"><label class="flabel">Founder feedback</label><textarea class="field" id="mk-feedback" rows="2">${esc(mk.feedback)}</textarea></div>
    <div class="modal-foot">${id?`<button class="btn danger" onclick="deleteMockup('${mk.id}')">Remove</button>`:''}<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMockup('${mk.id}')">Save</button></div>`);
}
function saveMockup(id){
  const data = {name:document.getElementById('mk-name').value.trim(), category:document.getElementById('mk-cat').value, version:document.getElementById('mk-version').value, status:document.getElementById('mk-status').value, owner:document.getElementById('mk-owner').value, notes:document.getElementById('mk-notes').value, feedback:document.getElementById('mk-feedback').value};
  if(!data.name){showToast('Enter a name');return;}
  if(!id) STATE.brand.mockups.push(Object.assign({id:uid('mk')}, data));
  else Object.assign(STATE.brand.mockups.find(x=>x.id===id), data);
  persist(); closeModal(); render();
}
function deleteMockup(id){ STATE.brand.mockups = STATE.brand.mockups.filter(x=>x.id!==id); persist(); closeModal(); render(); }
function renderBrandAssets(){
  return `<div class="grid grid-3">
    <div class="card"><div class="stat-label">Primary wordmark</div><div class="stat-sub" style="margin-top:6px;">AVORA — approved, established asset. Do not redesign without founder approval.</div></div>
    <div class="card"><div class="stat-label">Secondary mark</div><div class="stat-sub" style="margin-top:6px;">AV performance mark — for labels, hardware and small-format applications.</div></div>
    <div class="card"><div class="stat-label">Full guidelines</div><div class="stat-sub" style="margin-top:6px;">Store the full guidelines document reference in Notes → Brand, or attach a link once available.</div></div>
  </div>`;
}
function renderBrandNotes(){
  return `<div class="field-row"><label class="flabel">Brand Lab notes — experiments, references, open questions</label><textarea class="field" rows="10" oninput="STATE.brand.notes=this.value" onchange="persist()">${esc(STATE.brand.notes)}</textarea></div>`;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  return `<div class="page-header"><div><div class="page-eyebrow mono">Avora / System</div><div class="page-title">Settings</div><div class="page-subtitle">Founders, launch date and business defaults.</div></div></div>
  <div class="section-title">Founders</div>
  <div class="grid grid-3">
    ${STATE.settings.founders.map(f=>`<div class="card">
      <div class="field-row"><label class="flabel">Name</label><input class="field" value="${esc(f.name)}" onchange="updateFounder('${f.id}','name',this.value)"></div>
      <div class="grid grid-2">
        <div class="field-row"><label class="flabel">Initials</label><input class="field" value="${esc(f.initials)}" onchange="updateFounder('${f.id}','initials',this.value)"></div>
        <div class="field-row"><label class="flabel">Role title</label><input class="field" value="${esc(f.role)}" onchange="updateFounder('${f.id}','role',this.value)"></div>
      </div>
      <div class="field-row"><label class="flabel">Primary responsibilities (one per line)</label><textarea class="field" rows="3" onchange="updateFounderList('${f.id}','primary',this.value)">${(f.primary||[]).join('\n')}</textarea></div>
      <div class="field-row"><label class="flabel">Secondary responsibilities (one per line)</label><textarea class="field" rows="3" onchange="updateFounderList('${f.id}','secondary',this.value)">${(f.secondary||[]).join('\n')}</textarea></div>
    </div>`).join('')}
  </div>
  <div class="section-title">Business settings</div>
  <div class="card">
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Target launch date</label><input class="field" type="date" value="${STATE.settings.launchDate||''}" onchange="updateSettings('launchDate',this.value)"></div>
      <div class="field-row"><label class="flabel">Currency</label><select class="sel" onchange="updateSettings('currency',this.value)">${['GBP','EUR','USD'].map(c=>`<option ${STATE.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="grid grid-2">
      <div class="field-row"><label class="flabel">Low stock threshold (units)</label><input class="field" type="number" value="${STATE.settings.lowStockThreshold}" onchange="updateSettings('lowStockThreshold',parseInt(this.value)||0)"></div>
      <div class="field-row"><label class="flabel">Default margin target (%)</label><input class="field" type="number" value="${STATE.settings.marginTarget}" onchange="updateSettings('marginTarget',parseInt(this.value)||0)"></div>
    </div>
    <div class="field-row"><label class="flabel">VAT registered?</label><select class="sel" onchange="updateSettings('vatRegistered',this.value==='true')"><option value="false" ${!STATE.settings.vatRegistered?'selected':''}>No</option><option value="true" ${STATE.settings.vatRegistered?'selected':''}>Yes</option></select></div>
  </div>
  <div class="stat-sub" style="margin-top:14px;">This system is not a substitute for legal, accounting or tax advice — confirm company, tax and compliance matters with a qualified professional.</div>`;
}
function updateFounder(id,field,value){ const f=STATE.settings.founders.find(x=>x.id===id); f[field]=value; persist(); render(); }
function updateFounderList(id,field,value){ const f=STATE.settings.founders.find(x=>x.id===id); f[field]=value.split('\n').map(v=>v.trim()).filter(Boolean); persist(); }
function updateSettings(field,value){ STATE.settings[field]=value; persist(); render(); }

/* ================= BOOT ================= */
(async function boot(){ await loadState(); render(); })();
</script>
</body>
</html>
